<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conceitos e Tipos de Software</title>
    <link rel="icon" type="image/x-icon" href="https://github.com/88MVcode9/ARQUIVOS/blob/main/IMAGENS/POLICIAIS/GMA.jpeg?raw=true">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">    
    <link rel="stylesheet" href="https://88mvcode9.github.io/ARQUIVOS/ESTILOS/GMA/QUESTÕES.css?v=3">
</head>
<body>

    <!-- OVERLAY MOBILE -->
    <div class="overlay" id="overlay"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <i class="fas fa-laptop-code"></i> Informática
        </div>
        <button class="menu-item active" data-page="questoes" id="menuQuestoes">
            <i class="fas fa-list-ul"></i> Questões
        </button>
        <button class="menu-item" data-page="gabarito" id="menuGabarito">
            <i class="fas fa-check-circle"></i> Gabarito
        </button>
        <div class="menu-bottom">
            <div style="color:#484F58; font-size:0.75rem; padding:0.5rem 0;">
                <i class="fas fa-graduation-cap"></i> 16 questões • IDECAN
            </div>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
        <!-- TOPBAR -->
        <div class="topbar">
            <h1>
                <i class="fas fa-microchip" style="color:#2d9d5e;"></i>
                Conceitos e Tipos de Software
                <small>16 questões</small>
            </h1>
            <button class="menu-toggle" id="menuToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <!-- PÁGINA QUESTÕES -->
        <div class="page active" id="pageQuestoes">
            <div id="questoesContainer"></div>
        </div>

        <!-- PÁGINA GABARITO -->
        <div class="page" id="pageGabarito">
            <h2 style="margin-bottom:1.5rem; font-weight:600; display:flex; align-items:center; gap:10px;">
                <i class="fas fa-check-double" style="color:#2d9d5e;"></i> Gabarito Oficial
            </h2>
            <div id="gabaritoContainer"></div>
        </div>
    </main>

    <script>
        // ================================================================
        // 16 QUESTÕES SOBRE CONCEITOS E TIPOS DE SOFTWARE (IDECAN)
        // ================================================================
        const questoes = [
            {
                id: 1,
                texto: '(IDECAN - AGU / Adaptada) Quanto à classificação dos softwares quanto à sua finalidade no sistema computacional, assinale a alternativa que apresenta um exemplo de Software Básico:',
                pergunta: '',
                alternativas: [
                    'Microsoft Excel.',
                    'Google Chrome.',
                    'Sistema Operacional Linux.',
                    'Adobe Photoshop.',
                    'WinRAR.'
                ],
                gabarito: 2 // C
            },
            {
                id: 2,
                texto: '(IDECAN - IF-AM) Sobre os conceitos de Software Livre segundo a Free Software Foundation (FSF), considere as liberdades essenciais concedidas aos usuários. A liberdade de "executar o programa para qualquer propósito" corresponde historicamente à:',
                pergunta: '',
                alternativas: [
                    'Liberdade 0.',
                    'Liberdade 1.',
                    'Liberdade 2.',
                    'Liberdade 3.',
                    'Liberdade 4.'
                ],
                gabarito: 0 // A
            },
            {
                id: 3,
                texto: '(IDECAN - PM-MS) Em relação às modalidades de licenciamento de software, um programa disponibilizado gratuitamente para uso por tempo indeterminado, porém cujo código-fonte permanece fechado e de propriedade exclusiva do desenvolvedor, é classificado como:',
                pergunta: '',
                alternativas: [
                    'Shareware.',
                    'Freeware.',
                    'Malware.',
                    'Open Source.',
                    'Adware.'
                ],
                gabarito: 1 // B
            },
            {
                id: 4,
                texto: '(IDECAN - CAERN) No contexto dos sistemas operacionais, o Kernel desempenha um papel fundamental na arquitetura de software. Assinale a alternativa que define CORRETAMENTE a função do Kernel:',
                pergunta: '',
                alternativas: [
                    'É a interface gráfica do usuário que gerencia as janelas e ícones na área de trabalho.',
                    'É o conjunto de aplicativos de escritório instalados pelo usuário para tarefas diárias.',
                    'É o núcleo do sistema operacional, responsável por fazer a ponte entre o hardware e o software.',
                    'É o software antivírus encarregado de bloquear intrusões de rede.',
                    'É o navegador de internet padrão utilizado para acessar páginas da web.'
                ],
                gabarito: 2 // C
            },
            {
                id: 5,
                texto: '(IDECAN - Prefeitura de Feira de Santana - BA) Em relação aos tipos de software, os programas projetados para realizar manutenção, otimização e diagnóstico no sistema operacional (como o Desfragmentador de Disco e a Limpeza de Disco) são classificados como:',
                pergunta: '',
                alternativas: [
                    'Softwares de Prateleira.',
                    'Softwares de Aplicação.',
                    'Softwares Utilitários.',
                    'Softwares de Autoria.',
                    'Softwares de Firmware.'
                ],
                gabarito: 2 // C
            },
            {
                id: 6,
                texto: '(IDECAN - IF Sudeste MG) No suíte de escritório livre LibreOffice, a correspondência direta entre seus aplicativos e os softwares do pacote proprietário Microsoft Office para processador de texto, planilha eletrônica e apresentações é, respectivamente:',
                pergunta: '',
                alternativas: [
                    'Writer → Word; Calc → Excel; Impress → PowerPoint.',
                    'Calc → Word; Writer → Excel; Draw → PowerPoint.',
                    'Impress → Word; Calc → Excel; Math → PowerPoint.',
                    'Writer → Excel; Calc → Word; Impress → PowerPoint.',
                    'Math → Word; Base → Excel; Calc → PowerPoint.'
                ],
                gabarito: 0 // A
            },
            {
                id: 7,
                texto: '(IDECAN - PROCON-RJ) Os formatos abertos de documentos padronizados pela ODF (Open Document Format) são amplamente utilizados em softwares livres como o LibreOffice. Assinale a alternativa que indica a extensão correta para arquivos de Planilha Eletrônica:',
                pergunta: '',
                alternativas: [
                    '.odt',
                    '.ods',
                    '.odp',
                    '.odg',
                    '.docx'
                ],
                gabarito: 1 // B
            },
            {
                id: 8,
                texto: '(IDECAN - UNILAB) O software gravado diretamente em um chip de memória ROM (ou Flash) da placa-mãe de um computador, responsável pela inicialização do hardware e pela carga do sistema operacional, é denominado:',
                pergunta: '',
                alternativas: [
                    'Middleware.',
                    'Spyware.',
                    'Firmware (ex.: BIOS/UEFI).',
                    'Shareware.',
                    'Ransomware.'
                ],
                gabarito: 2 // C
            },
            {
                id: 9,
                texto: '(IDECAN - SME João Pessoa - PB) Considere o modelo de serviço da Computação em Nuvem (Cloud Computing) em que o usuário acessa aplicativos prontos executados na infraestrutura do provedor por meio de um navegador web, sem necessidade de instalar o software localmente. Esse modelo é conhecido como:',
                pergunta: '',
                alternativas: [
                    'IaaS (Infrastructure as a Service).',
                    'PaaS (Platform as a Service).',
                    'SaaS (Software as a Service).',
                    'BaaS (Backend as a Service).',
                    'DaaS (Data as a Service).'
                ],
                gabarito: 2 // C
            },
            {
                id: 10,
                texto: '(IDECAN - Polícia Civil SC) Em um processador de textos como o Microsoft Word, o recurso de software que permite criar um lote de documentos personalizados para diferentes destinatários (como cartas, etiquetas ou e-mails) utilizando uma base de dados externa chama-se:',
                pergunta: '',
                alternativas: [
                    'Controle de Alterações.',
                    'Mala Direta.',
                    'Sumário Automático.',
                    'Tabela Dinâmica.',
                    'Macro de Execução.'
                ],
                gabarito: 1 // B
            },
            {
                id: 11,
                texto: '(IDECAN - Prefeitura de Mossoró - RN) No aplicativo de planilhas Microsoft Excel, o uso do símbolo cifrão ($) em uma fórmula (exemplo: =$A$1+B2) representa o uso de:',
                pergunta: '',
                alternativas: [
                    'Referência Relativa, que muda ao ser copiada para outra célula.',
                    'Referência Absoluta, que fixa a célula referenciada e não se altera ao ser copiada.',
                    'Referência Circular, que gera um erro de cálculo infinito.',
                    'Formatação Monetária automática para a célula.',
                    'Operador lógico de comparação.'
                ],
                gabarito: 1 // B
            },
            {
                id: 12,
                texto: '(IDECAN - IF-AM) Qual categoria de software malicioso (Malware) caracteriza-se por criptografar os arquivos da vítima e exigir o pagamento de um "resgate" (geralmente em criptomoedas) para fornecer a chave de descriptografia?',
                pergunta: '',
                alternativas: [
                    'Trojan (Cavalo de Tróia).',
                    'Worm.',
                    'Ransomware.',
                    'Rootkit.',
                    'Keylogger.'
                ],
                gabarito: 2 // C
            },
            {
                id: 13,
                texto: '(IDECAN - AGU) Em relação aos softwares de navegação na internet (Web Browsers), o recurso que impede que o histórico de navegação, cookies e dados de formulários sejam salvos no computador local durante a sessão é denominado:',
                pergunta: '',
                alternativas: [
                    'Firewall Integrado.',
                    'Modo de Exibição de Compatibilidade.',
                    'Navegação Anônima / InPrivate.',
                    'Bloqueador de Pop-ups.',
                    'Servidor Proxy Reverso.'
                ],
                gabarito: 2 // C
            },
            {
                id: 14,
                texto: '(IDECAN - CAERN) Um programa que se passa por um aplicativo útil ou inofensivo para enganar o usuário e, ao ser executado, realiza ações maliciosas escondidas em segundo plano é conhecido como:',
                pergunta: '',
                alternativas: [
                    'Trojan (Cavalo de Tróia).',
                    'Firewall.',
                    'Antivirus.',
                    'Bootloader.',
                    'Driver.'
                ],
                gabarito: 0 // A
            },
            {
                id: 15,
                texto: '(IDECAN - Prefeitura de Feira de Santana - BA) Os softwares responsáveis por permitir a comunicação direta entre o Sistema Operacional e um dispositivo de hardware específico (como uma placa de vídeo ou uma impressora) são chamados de:',
                pergunta: '',
                alternativas: [
                    'Compiladores.',
                    'Drivers de Dispositivo.',
                    'Utilitários de Disco.',
                    'Navegadores.',
                    'Linguagens de Programação.'
                ],
                gabarito: 1 // B
            },
            {
                id: 16,
                texto: '(IDECAN - Perfil Concursos Superior) A modalidade de licenciamento de software em que o programa é distribuído gratuitamente para teste por um período limitado (ou com funcionalidades reduzidas), exigindo pagamento após esse período para continuidade do uso completo, é o:',
                pergunta: '',
                alternativas: [
                    'Freeware.',
                    'Shareware (ou Trial).',
                    'Software Livre.',
                    'Domínio Público.',
                    'Copyleft.'
                ],
                gabarito: 1 // B
            }
        ];

        // ================================================================
        // RENDERIZAÇÃO
        // ================================================================
        const letras = ['A', 'B', 'C', 'D', 'E'];

        function renderQuestoes() {
            const container = document.getElementById('questoesContainer');
            container.innerHTML = '';
            questoes.forEach((q, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'questao-wrapper';
                wrapper.dataset.index = idx;

                // Header
                const header = document.createElement('div');
                header.className = 'questao-header';
                let banca = 'IDECAN';
                if (q.texto && q.texto.startsWith('(')) {
                    const end = q.texto.indexOf(')');
                    if (end > 0) banca = q.texto.substring(1, end);
                }
                header.innerHTML = `
                    <span class="numero">Q${q.id}</span>
                    <span class="badge">${banca}</span>
                `;
                wrapper.appendChild(header);

                // Texto (enunciado)
                if (q.texto) {
                    const textoDiv = document.createElement('div');
                    textoDiv.className = 'questao-texto';
                    textoDiv.textContent = q.texto;
                    wrapper.appendChild(textoDiv);
                }

                // Pergunta (se houver)
                if (q.pergunta) {
                    const pergunta = document.createElement('div');
                    pergunta.className = 'questao-pergunta';
                    pergunta.textContent = q.pergunta;
                    wrapper.appendChild(pergunta);
                }

                // Alternativas
                const altDiv = document.createElement('div');
                altDiv.className = 'alternativas';
                q.alternativas.forEach((alt, i) => {
                    const label = document.createElement('label');
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = `q${idx}`;
                    radio.value = i;
                    label.appendChild(radio);
                    label.appendChild(document.createTextNode(`${letras[i]}) ${alt}`));
                    altDiv.appendChild(label);
                });
                wrapper.appendChild(altDiv);

                // Actions
                const actions = document.createElement('div');
                actions.className = 'questao-actions';

                const btn = document.createElement('button');
                btn.className = 'btn-verificar';
                btn.innerHTML = '<i class="fas fa-check"></i> Verificar';
                btn.addEventListener('click', () => verificarQuestao(idx));

                const feedback = document.createElement('span');
                feedback.className = 'feedback';
                feedback.id = `feedback-${idx}`;

                const gabDiv = document.createElement('span');
                gabDiv.className = 'gabarito-revelado';
                gabDiv.id = `gabarito-revelado-${idx}`;

                actions.appendChild(btn);
                actions.appendChild(feedback);
                actions.appendChild(gabDiv);
                wrapper.appendChild(actions);

                container.appendChild(wrapper);
            });
        }

        function verificarQuestao(idx) {
            const q = questoes[idx];
            const radios = document.querySelectorAll(`input[name="q${idx}"]`);
            let selecionado = null;
            radios.forEach(r => { if (r.checked) selecionado = parseInt(r.value); });

            const feedback = document.getElementById(`feedback-${idx}`);
            const gabDiv = document.getElementById(`gabarito-revelado-${idx}`);

            if (selecionado === null) {
                feedback.textContent = '⚠️ Selecione uma alternativa.';
                feedback.className = 'feedback';
                feedback.style.color = '#f0a030';
                gabDiv.textContent = '';
                return;
            }

            const correta = q.gabarito;
            if (selecionado === correta) {
                feedback.textContent = '✅ Correta!';
                feedback.className = 'feedback correto';
                gabDiv.textContent = '';
            } else {
                feedback.textContent = '❌ Incorreta.';
                feedback.className = 'feedback incorreto';
                gabDiv.textContent = `Resposta correta: ${letras[correta]}`;
            }
        }

        function renderGabarito() {
            const container = document.getElementById('gabaritoContainer');
            let html = `
                <table class="gabarito-tabela">
                    <thead><tr><th>Questão</th><th>Resposta</th></tr></thead>
                    <tbody>
            `;
            questoes.forEach(q => {
                html += `<tr><td>Q${q.id}</td><td class="resp">${letras[q.gabarito]}</td></tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // ================================================================
        // NAVEGAÇÃO ENTRE ABAS
        // ================================================================
        function navegarPara(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page${page.charAt(0).toUpperCase() + page.slice(1)}`).classList.add('active');

            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            if (page === 'questoes') {
                document.getElementById('menuQuestoes').classList.add('active');
            } else {
                document.getElementById('menuGabarito').classList.add('active');
            }

            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('active');
        }

        document.getElementById('menuQuestoes').addEventListener('click', () => navegarPara('questoes'));
        document.getElementById('menuGabarito').addEventListener('click', () => navegarPara('gabarito'));

        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        });
        document.getElementById('overlay').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('active');
        });

        // ================================================================
        // INICIALIZAÇÃO
        // ================================================================
        renderQuestoes();
        renderGabarito();
    </script>

</body>
</html>
