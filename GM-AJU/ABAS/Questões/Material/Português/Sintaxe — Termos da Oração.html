<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sintaxe – Termos da Oração</title>
    <link rel="icon" type="image/x-icon" href="https://github.com/88MVcode9/ARQUIVOS/blob/main/IMAGENS/POLICIAIS/GMA.jpeg?raw=true">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">    
    <link rel="stylesheet" href="https://88mvcode9.github.io/ARQUIVOS/ESTILOS/GMA/SIMULADOS.css">
    <style>
        /* Estilo extra para os comentários no gabarito */
        .comentario-gabarito {
            font-size: 0.85rem;
            color: #555;
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 4px;
            border-left: 3px solid #2d9d5e;
            line-height: 1.5;
        }
        .comentario-gabarito strong {
            color: #1a7a3a;
        }
        .gabarito-tabela td {
            vertical-align: top;
            padding: 8px 6px;
        }
        .gabarito-tabela .resp {
            font-weight: 700;
            color: #2d9d5e;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- OVERLAY MOBILE -->
    <div class="overlay" id="overlay"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <i class="fas fa-pencil-alt"></i> Português
        </div>
        <button class="menu-item active" data-page="questoes" id="menuQuestoes">
            <i class="fas fa-list-ul"></i> Questões
        </button>
        <button class="menu-item" data-page="gabarito" id="menuGabarito">
            <i class="fas fa-check-circle"></i> Gabarito
        </button>
        <div class="menu-bottom">
            <div style="color:#484F58; font-size:0.75rem; padding:0.5rem 0;">
                <i class="fas fa-graduation-cap"></i> 20 questões • Sintaxe
            </div>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
        <!-- TOPBAR -->
        <div class="topbar">
            <h1>
                <i class="fas fa-book-open" style="color:#2d9d5e;"></i>
                Sintaxe — Termos da Oração
                <small>20 questões</small>
            </h1>
            <button class="menu-toggle" id="menuToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <!-- PÁGINA QUESTÕES -->
        <div class="page active" id="pageQuestoes">
            <div id="questoesContainer"></div>
        </div>

        <!-- PÁGINA GABARITO -->
        <div class="page" id="pageGabarito">
            <h2 style="margin-bottom:1.5rem; font-weight:600; display:flex; align-items:center; gap:10px;">
                <i class="fas fa-check-double" style="color:#2d9d5e;"></i> Gabarito com Comentários
            </h2>
            <div id="gabaritoContainer"></div>
        </div>
    </main>

    <script>
        // ================================================================
        // 20 QUESTÕES – SINTAXE: TERMOS DA ORAÇÃO
        // Cada questão agora possui um campo "comentario" para o gabarito.
        // ================================================================
        const questoes = [
            {
                id: 1,
                texto: 'Assinale a alternativa em que o termo destacado exerce a função sintática de sujeito.',
                pergunta: '',
                alternativas: [
                    'O candidato estudou durante toda a noite.',
                    'Os alunos resolveram todas as questões.',
                    'O professor explicou a matéria.',
                    'O fiscal entregou o cartão ao candidato.',
                    'A prova estava muito difícil.'
                ],
                gabarito: 1, // B
                comentario: 'Pergunte: Quem resolveu todas as questões? → "Os alunos". Nas demais: "durante toda a noite" é adjunto adverbial; "a matéria" é objeto direto; "ao candidato" é objeto indireto; "muito difícil" é predicativo do sujeito.'
            },
            {
                id: 2,
                texto: '“Os candidatos realizaram a prova tranquilamente.” O predicado é:',
                pergunta: '',
                alternativas: [
                    'Os candidatos',
                    'realizaram',
                    'realizaram a prova tranquilamente',
                    'a prova',
                    'tranquilamente'
                ],
                gabarito: 2, // C
                comentario: 'Sujeito = "Os candidatos". Tudo que se declara sobre o sujeito é o predicado: "realizaram a prova tranquilamente". O núcleo do predicado é o verbo "realizaram".'
            },
            {
                id: 3,
                texto: 'Assinale a alternativa em que o termo destacado exerce função de objeto direto.',
                pergunta: '',
                alternativas: [
                    'O servidor obedeceu ao regulamento.',
                    'O candidato necessita de preparação.',
                    'O professor corrigiu as provas.',
                    'O aluno confiou no professor.',
                    'O militar gosta da profissão.'
                ],
                gabarito: 2, // C
                comentario: 'Pergunte: O professor corrigiu o quê? → "as provas". Sem preposição obrigatória, é objeto direto. As demais têm preposição exigida pelo verbo (obedecer a, necessitar de, confiar em, gostar de) → objeto indireto.'
            },
            {
                id: 4,
                texto: '“O candidato precisa de muita dedicação.” O termo "de muita dedicação" é:',
                pergunta: '',
                alternativas: [
                    'objeto direto',
                    'objeto indireto',
                    'complemento nominal',
                    'adjunto adnominal',
                    'predicativo do sujeito'
                ],
                gabarito: 1, // B
                comentario: 'O verbo "precisa" exige a preposição "de" (quem precisa, precisa de algo). Portanto, "de muita dedicação" completa o sentido do verbo com preposição → objeto indireto.'
            },
            {
                id: 5,
                texto: 'Assinale a alternativa em que o termo destacado exerce função de adjunto adnominal.',
                pergunta: '',
                alternativas: [
                    'O aluno necessita de ajuda.',
                    'O professor entregou o material ao aluno.',
                    'Os novos candidatos chegaram cedo.',
                    'A aprovação depende de dedicação.',
                    'O candidato ficou nervoso.'
                ],
                gabarito: 2, // C
                comentario: '"novos" e "Os" acompanham e caracterizam o substantivo "candidatos" → adjuntos adnominais. Os demais destacam complementos verbais (objeto indireto) ou predicativo.'
            },
            {
                id: 6,
                texto: '“A aprovação no concurso depende da dedicação aos estudos.” O termo "aos estudos" exerce função de:',
                pergunta: '',
                alternativas: [
                    'objeto direto',
                    'objeto indireto',
                    'complemento nominal',
                    'adjunto adnominal',
                    'predicativo'
                ],
                gabarito: 2, // C
                comentario: '"dedicação" é substantivo abstrato; "aos estudos" completa seu sentido (dedicação a quê?). Portanto, complemento nominal. Cuidado: não confundir com objeto indireto, que completa verbo, não substantivo.'
            },
            {
                id: 7,
                texto: 'Assinale a alternativa em que o termo destacado exerce função de adjunto adverbial de tempo.',
                pergunta: '',
                alternativas: [
                    'O candidato estudou na biblioteca.',
                    'O candidato estudou com dedicação.',
                    'O candidato estudou durante a noite.',
                    'O candidato estudou para a prova.',
                    'O candidato estudou silenciosamente.'
                ],
                gabarito: 2, // C
                comentario: 'Pergunte: estudou quando? → "durante a noite" (tempo). "na biblioteca" (lugar), "com dedicação" e "silenciosamente" (modo), "para a prova" (finalidade).'
            },
            {
                id: 8,
                texto: '“Brasília, capital do Brasil, recebe milhares de visitantes.” "capital do Brasil" é:',
                pergunta: '',
                alternativas: [
                    'vocativo',
                    'aposto',
                    'objeto direto',
                    'complemento nominal',
                    'predicativo do sujeito'
                ],
                gabarito: 1, // B
                comentario: '"capital do Brasil" explica quem é Brasília (relação de equivalência) → aposto explicativo. Não confunda com predicativo, pois não há verbo de ligação entre eles.'
            },
            {
                id: 9,
                texto: 'Assinale a alternativa em que há vocativo.',
                pergunta: '',
                alternativas: [
                    'Pedro, estude mais para a prova.',
                    'Pedro estudou muito para a prova.',
                    'A prova de Pedro foi excelente.',
                    'Pedro comprou um livro.',
                    'Pedro ficou cansado.'
                ],
                gabarito: 0, // A
                comentario: 'Na alternativa A, "Pedro" é um chamamento, interpelação direta → vocativo. Nas demais, "Pedro" exerce função de sujeito (pratica a ação).'
            },
            {
                id: 10,
                texto: '“O candidato estava muito confiante.” "muito confiante" é:',
                pergunta: '',
                alternativas: [
                    'objeto direto',
                    'objeto indireto',
                    'adjunto adverbial',
                    'predicativo do sujeito',
                    'complemento nominal'
                ],
                gabarito: 3, // D
                comentario: '"muito confiante" atribui uma característica ao sujeito "O candidato" (candidato = confiante) → predicativo do sujeito. Verbos de ligação (estar, ser, ficar, etc.) pedem predicativo.'
            },
            {
                id: 11,
                texto: '“O professor considerou a questão difícil.” "difícil" exerce função de:',
                pergunta: '',
                alternativas: [
                    'predicativo do sujeito',
                    'predicativo do objeto',
                    'adjunto adnominal',
                    'complemento nominal',
                    'objeto indireto'
                ],
                gabarito: 1, // B
                comentario: '"difícil" caracteriza o objeto direto "a questão" → predicativo do objeto. Verbo "considerar" é verbo transitivo direto e predicativo (verbo bitransitivo).'
            },
            {
                id: 12,
                texto: '“A prova foi elaborada pelos professores.” "pelos professores" é:',
                pergunta: '',
                alternativas: [
                    'objeto direto',
                    'objeto indireto',
                    'agente da passiva',
                    'complemento nominal',
                    'adjunto adverbial'
                ],
                gabarito: 2, // C
                comentario: 'Na voz passiva, "pelos professores" indica quem realizou a ação → agente da passiva. Vem sempre precedido da preposição "por" (ou "pela", "pelos").'
            },
            {
                id: 13,
                texto: '“Os candidatos estudaram bastante para o concurso.” A alternativa correta é:',
                pergunta: '',
                alternativas: [
                    '"Os candidatos" = objeto direto; "bastante" = adjunto adnominal.',
                    '"Os candidatos" = sujeito; "bastante" = adjunto adverbial.',
                    '"Os candidatos" = sujeito; "para o concurso" = objeto indireto.',
                    '"estudaram" = predicado; "para o concurso" = objeto direto.',
                    '"bastante" = complemento nominal; "para o concurso" = adjunto adnominal.'
                ],
                gabarito: 1, // B
                comentario: '"Os candidatos" → sujeito (quem estudou?). "bastante" → adjunto adverbial de intensidade (como estudaram?). "para o concurso" → adjunto adverbial de finalidade.'
            },
            {
                id: 14,
                texto: 'Assinale a alternativa que apresenta um termo integrante da oração.',
                pergunta: '',
                alternativas: [
                    'adjunto adverbial',
                    'aposto',
                    'vocativo',
                    'objeto direto',
                    'adjunto adnominal'
                ],
                gabarito: 3, // D
                comentario: 'Termos integrantes: objeto direto, objeto indireto, complemento nominal e agente da passiva. Os demais são acessórios (adjunto adnominal, adjunto adverbial, aposto) ou independente (vocativo).'
            },
            {
                id: 15,
                texto: 'São termos acessórios:',
                pergunta: '',
                alternativas: [
                    'sujeito, objeto direto e objeto indireto.',
                    'predicativo, agente da passiva e sujeito.',
                    'adjunto adnominal, adjunto adverbial e aposto.',
                    'objeto direto, complemento nominal e vocativo.',
                    'sujeito, predicado e agente da passiva.'
                ],
                gabarito: 2, // C
                comentario: 'Termos acessórios: adjunto adnominal, adjunto adverbial e aposto. Essenciais: sujeito e predicado. Integrantes: OD, OI, complemento nominal, agente da passiva. Vocativo é termo à parte.'
            },
            {
                id: 16,
                texto: '“O policial encontrou o suspeito ontem.” Assinale a alternativa correta.',
                pergunta: '',
                alternativas: [
                    '"O policial" é objeto direto.',
                    '"o suspeito" é objeto indireto.',
                    '"ontem" é adjunto adverbial de tempo.',
                    '"o suspeito" é predicativo do sujeito.',
                    '"O policial" é complemento nominal.'
                ],
                gabarito: 2, // C
                comentario: '"O policial" → sujeito. "o suspeito" → objeto direto (encontrou quem?). "ontem" → adjunto adverbial de tempo (quando?).'
            },
            {
                id: 17,
                texto: 'Assinale a alternativa em que o termo destacado exerce função de complemento nominal.',
                pergunta: '',
                alternativas: [
                    'A casa do professor foi vendida.',
                    'O amor de mãe é importante.',
                    'A necessidade de ajuda aumentou.',
                    'O livro do aluno desapareceu.',
                    'A chegada do candidato foi anunciada.'
                ],
                gabarito: 2, // C
                comentario: '"de ajuda" completa o sentido do substantivo abstrato "necessidade" (necessidade de quê?) → complemento nominal. Nos demais, os termos indicam posse ou pertencimento → adjuntos adnominais.'
            },
            {
                id: 18,
                texto: '“O professor entregou o resultado aos candidatos.” "o resultado" e "aos candidatos" são, respectivamente:',
                pergunta: '',
                alternativas: [
                    'objeto indireto e objeto direto.',
                    'objeto direto e objeto indireto.',
                    'complemento nominal e objeto direto.',
                    'adjunto adnominal e complemento nominal.',
                    'predicativo e objeto indireto.'
                ],
                gabarito: 1, // B
                comentario: 'Entregou o quê? → "o resultado" (OD). Entregou a quem? → "aos candidatos" (OI). Verbo "entregar" é transitivo direto e indireto (VTDI).'
            },
            {
                id: 19,
                texto: 'Assinale a alternativa em que há sujeito indeterminado.',
                pergunta: '',
                alternativas: [
                    'Os candidatos chegaram cedo.',
                    'Choveu durante toda a manhã.',
                    'Precisa-se de funcionários.',
                    'O professor explicou a matéria.',
                    'A prova foi realizada ontem.'
                ],
                gabarito: 2, // C
                comentario: '"Precisa-se de funcionários": verbo na 3ª pessoa + "se" + objeto indireto → índice de indeterminação do sujeito. Na B, é sujeito inexistente (verbo impessoal). As demais têm sujeito determinado.'
            },
            {
                id: 20,
                texto: '“Durante a manhã, os candidatos resolveram as questões da prova com atenção.” Assinale a alternativa correta.',
                pergunta: '',
                alternativas: [
                    '"Durante a manhã" = adjunto adverbial de tempo; "os candidatos" = sujeito; "as questões" = objeto direto.',
                    '"Durante a manhã" = complemento nominal; "os candidatos" = objeto direto; "as questões" = sujeito.',
                    '"os candidatos" = objeto indireto; "da prova" = objeto direto; "com atenção" = complemento nominal.',
                    '"as questões" = sujeito; "da prova" = objeto indireto; "com atenção" = predicativo.',
                    '"os candidatos" = sujeito; "as questões" = objeto indireto; "com atenção" = agente da passiva.'
                ],
                gabarito: 0, // A
                comentario: '"Durante a manhã" → tempo (adv. adj.). "os candidatos" → sujeito (quem resolveu?). "as questões" → OD (resolveu o quê?). "da prova" → adjunto adnominal (especifica questões). "com atenção" → adjunto adverbial de modo.'
            }
        ];

        // ================================================================
        // RENDERIZAÇÃO DAS QUESTÕES
        // ================================================================
        const letras = ['A', 'B', 'C', 'D', 'E'];

        function renderQuestoes() {
            const container = document.getElementById('questoesContainer');
            container.innerHTML = '';
            questoes.forEach((q, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'questao-wrapper';
                wrapper.dataset.index = idx;

                // Header
                const header = document.createElement('div');
                header.className = 'questao-header';
                header.innerHTML = `
                    <span class="numero">Q${q.id}</span>
                    <span class="badge">Sintaxe</span>
                `;
                wrapper.appendChild(header);

                // Texto
                if (q.texto) {
                    const textoDiv = document.createElement('div');
                    textoDiv.className = 'questao-texto';
                    textoDiv.textContent = q.texto;
                    wrapper.appendChild(textoDiv);
                }

                // Pergunta
                if (q.pergunta) {
                    const pergunta = document.createElement('div');
                    pergunta.className = 'questao-pergunta';
                    pergunta.textContent = q.pergunta;
                    wrapper.appendChild(pergunta);
                }

                // Alternativas
                const altDiv = document.createElement('div');
                altDiv.className = 'alternativas';
                q.alternativas.forEach((alt, i) => {
                    const label = document.createElement('label');
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = `q${idx}`;
                    radio.value = i;
                    label.appendChild(radio);
                    label.appendChild(document.createTextNode(`${letras[i]}) ${alt}`));
                    altDiv.appendChild(label);
                });
                wrapper.appendChild(altDiv);

                // Actions
                const actions = document.createElement('div');
                actions.className = 'questao-actions';

                const btn = document.createElement('button');
                btn.className = 'btn-verificar';
                btn.innerHTML = '<i class="fas fa-check"></i> Verificar';
                btn.addEventListener('click', () => verificarQuestao(idx));

                const feedback = document.createElement('span');
                feedback.className = 'feedback';
                feedback.id = `feedback-${idx}`;

                const gabDiv = document.createElement('span');
                gabDiv.className = 'gabarito-revelado';
                gabDiv.id = `gabarito-revelado-${idx}`;

                actions.appendChild(btn);
                actions.appendChild(feedback);
                actions.appendChild(gabDiv);
                wrapper.appendChild(actions);

                container.appendChild(wrapper);
            });
        }

        function verificarQuestao(idx) {
            const q = questoes[idx];
            const radios = document.querySelectorAll(`input[name="q${idx}"]`);
            let selecionado = null;
            radios.forEach(r => { if (r.checked) selecionado = parseInt(r.value); });

            const feedback = document.getElementById(`feedback-${idx}`);
            const gabDiv = document.getElementById(`gabarito-revelado-${idx}`);

            if (selecionado === null) {
                feedback.textContent = '⚠️ Selecione uma alternativa.';
                feedback.className = 'feedback';
                feedback.style.color = '#f0a030';
                gabDiv.textContent = '';
                return;
            }

            const correta = q.gabarito;
            if (selecionado === correta) {
                feedback.textContent = '✅ Correta!';
                feedback.className = 'feedback correto';
                gabDiv.textContent = '';
            } else {
                feedback.textContent = '❌ Incorreta.';
                feedback.className = 'feedback incorreto';
                gabDiv.textContent = `Resposta correta: ${letras[correta]}`;
            }
        }

        // ================================================================
        // RENDERIZAÇÃO DO GABARITO COM COMENTÁRIOS
        // ================================================================
        function renderGabarito() {
            const container = document.getElementById('gabaritoContainer');
            let html = `
                <table class="gabarito-tabela">
                    <thead><tr><th style="width:60px;">Q</th><th style="width:70px;">Resposta</th><th>Comentário</th></tr></thead>
                    <tbody>
            `;
            questoes.forEach(q => {
                html += `
                    <tr>
                        <td style="text-align:center; font-weight:600;">Q${q.id}</td>
                        <td class="resp">${letras[q.gabarito]}</td>
                        <td>
                            <div class="comentario-gabarito">
                                <strong>Explicação:</strong> ${q.comentario}
                            </div>
                        </td>
                    </tr>
                `;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // ================================================================
        // NAVEGAÇÃO ENTRE ABAS
        // ================================================================
        function navegarPara(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page${page.charAt(0).toUpperCase() + page.slice(1)}`).classList.add('active');

            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            if (page === 'questoes') {
                document.getElementById('menuQuestoes').classList.add('active');
            } else {
                document.getElementById('menuGabarito').classList.add('active');
            }

            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('active');
        }

        document.getElementById('menuQuestoes').addEventListener('click', () => navegarPara('questoes'));
        document.getElementById('menuGabarito').addEventListener('click', () => navegarPara('gabarito'));

        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        });
        document.getElementById('overlay').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('active');
        });

        // ================================================================
        // INICIALIZAÇÃO
        // ================================================================
        renderQuestoes();
        renderGabarito();
    </script>

</body>
</html>
