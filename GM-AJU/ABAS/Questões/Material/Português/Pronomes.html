        // RENDERIZAÇÃO

        const letras = ['A', 'B', 'C', 'D', 'E'];

        function renderQuestoes() {
            const container = document.getElementById('questoesContainer');
            container.innerHTML = '';
            questoes.forEach((q, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'questao-wrapper';
                wrapper.dataset.index = idx;

                // Header
                const header = document.createElement('div');
                header.className = 'questao-header';
                let banca = 'IDECAN';
                if (q.texto && q.texto.startsWith('(')) {
                    const end = q.texto.indexOf(')');
                    if (end > 0) banca = q.texto.substring(1, end);
                }
                header.innerHTML = `
                    <span class="numero">Q${q.id}</span>
                    <span class="badge">${banca}</span>
                `;
                wrapper.appendChild(header);

                // Texto (enunciado)
                if (q.texto) {
                    const textoDiv = document.createElement('div');
                    textoDiv.className = 'questao-texto';
                    textoDiv.textContent = q.texto;
                    wrapper.appendChild(textoDiv);
                }

                // Pergunta (se houver)
                if (q.pergunta) {
                    const pergunta = document.createElement('div');
                    pergunta.className = 'questao-pergunta';
                    pergunta.textContent = q.pergunta;
                    wrapper.appendChild(pergunta);
                }

                // Alternativas
                const altDiv = document.createElement('div');
                altDiv.className = 'alternativas';
                q.alternativas.forEach((alt, i) => {
                    const label = document.createElement('label');
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = `q${idx}`;
                    radio.value = i;
                    label.appendChild(radio);
                    label.appendChild(document.createTextNode(`${letras[i]}) ${alt}`));
                    altDiv.appendChild(label);
                });
                wrapper.appendChild(altDiv);

                // Actions
                const actions = document.createElement('div');
                actions.className = 'questao-actions';

                const btn = document.createElement('button');
                btn.className = 'btn-verificar';
                btn.innerHTML = '<i class="fas fa-check"></i> Verificar';
                btn.addEventListener('click', () => verificarQuestao(idx));

                const feedback = document.createElement('span');
                feedback.className = 'feedback';
                feedback.id = `feedback-${idx}`;

                const gabDiv = document.createElement('span');
                gabDiv.className = 'gabarito-revelado';
                gabDiv.id = `gabarito-revelado-${idx}`;

                actions.appendChild(btn);
                actions.appendChild(feedback);
                actions.appendChild(gabDiv);
                wrapper.appendChild(actions);

                container.appendChild(wrapper);
            });
        }

        function verificarQuestao(idx) {
            const q = questoes[idx];
            const radios = document.querySelectorAll(`input[name="q${idx}"]`);
            let selecionado = null;
            radios.forEach(r => { if (r.checked) selecionado = parseInt(r.value); });

            const feedback = document.getElementById(`feedback-${idx}`);
            const gabDiv = document.getElementById(`gabarito-revelado-${idx}`);

            if (selecionado === null) {
                feedback.textContent = '⚠️ Selecione uma alternativa.';
                feedback.className = 'feedback';
                feedback.style.color = '#f0a030';
                gabDiv.textContent = '';
                return;
            }

            const correta = q.gabarito;
            if (selecionado === correta) {
                feedback.textContent = '✅ Correta!';
                feedback.className = 'feedback correto';
                gabDiv.textContent = '';
            } else {
                feedback.textContent = '❌ Incorreta.';
                feedback.className = 'feedback incorreto';
                gabDiv.textContent = `Resposta correta: ${letras[correta]}`;
            }
        }

        function renderGabarito() {
            const container = document.getElementById('gabaritoContainer');
            let html = `
                <table class="gabarito-tabela">
                    <thead><tr><th>Questão</th><th>Resposta</th></tr></thead>
                    <tbody>
            `;
            questoes.forEach(q => {
                html += `<tr><td>Q${q.id}</td><td class="resp">${letras[q.gabarito]}</td></tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // ================================================================
        // NAVEGAÇÃO ENTRE ABAS
        // ================================================================
        function navegarPara(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page${page.charAt(0).toUpperCase() + page.slice(1)}`).classList.add('active');

            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            if (page === 'questoes') {
                document.getElementById('menuQuestoes').classList.add('active');
            } else {
                document.getElementById('menuGabarito').classList.add('active');
            }

            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('active');
        }

        document.getElementById('menuQuestoes').addEventListener('click', () => navegarPara('questoes'));
        document.getElementById('menuGabarito').addEventListener('click', () => navegarPara('gabarito'));

        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        });
        document.getElementById('overlay').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('active');
        });

        // ================================================================
        // INICIALIZAÇÃO
        // ================================================================
        renderQuestoes();
        renderGabarito();
    </script>

</body>
</html>
