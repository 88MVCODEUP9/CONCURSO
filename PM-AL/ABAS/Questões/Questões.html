                { nome: 'Ação penal militar', link: 'https://88mvcodeup9.github.io/CONCURSO/PM-AL/ABAS/Quest%C3%B5es/Material/Legislação Pertinente ao Policial Militar/Ação penal militar.html' },
                { nome: 'Competência da Justiça Militar estadual', link: 'https://88mvcodeup9.github.io/CONCURSO/PM-AL/ABAS/Quest%C3%B5es/Material/Legislação Pertinente ao Policial Militar/Competência da Justiça Militar estadual.html' },

                { nome: 'Prisões e medidas cautelares na esfera militar', link: 'https://88mvcodeup9.github.io/CONCURSO/PM-AL/ABAS/Quest%C3%B5es/Material/Legislação Pertinente ao Policial Militar/Prisões e medidas cautelares na esfera militar.html' },
                { nome: 'Procedimentos processuais penais militares', link: 'https://88mvcodeup9.github.io/CONCURSO/PM-AL/ABAS/Quest%C3%B5es/Material/Legislação Pertinente ao Policial Militar/Procedimentos processuais penais militares.html' },
                { nome: 'Recursos no processo penal militar', link: 'https://88mvcodeup9.github.io/CONCURSO/PM-AL/ABAS/Quest%C3%B5es/Material/Legislação Pertinente ao Policial Militar/Recursos no processo penal militar.html' },
                { nome: 'Execução penal militar', link: 'https://88mvcodeup9.github.io/CONCURSO/PM-AL/ABAS/Quest%C3%B5es/Material/Legislação Pertinente ao Policial Militar/Execução penal militar.html' },
            ],
            data: 'Prova 2026',
            banca: 'IDECAN',
            questoes: '~8 questões',
        }, {
            id: 12,
            nome: 'Noções de\nDireitos Humanos',
            nomeLinha: 'Noções de Direitos Humanos',
            tipo: 'Módulo 12',
            subtitulo: 'Cidadania e Garantias',
            topicos: [
                { nome: 'Declaração Universal dos Direitos Humanos', link: 'https://88mvcodeup9.github.io/CONCURSO/PM-AL/ABAS/Quest%C3%B5es/Material/Legislação Pertinente aos Direitos Humanos/Declaração Universal dos Direitos Humanos.html' },
                { nome: 'Direitos humanos e sua aplicação na atividade policial', link: 'https://88mvcodeup9.github.io/CONCURSO/PM-AL/ABAS/Quest%C3%B5es/Material/Legislação Pertinente aos Direitos Humanos/Direitos humanos e sua aplicação na atividade policial.html' },
                { nome: 'Tratados e convenções internacionais sobre direitos humanos', link: 'https://88mvcodeup9.github.io/CONCURSO/PM-AL/ABAS/Quest%C3%B5es/Material/Legislação Pertinente aos Direitos Humanos/Tratados e convenções internacionais sobre direitos humanos.html' },

                { nome: 'Direitos humanos e segurança pública', link: 'https://88mvcodeup9.github.io/CONCURSO/PM-AL/ABAS/Quest%C3%B5es/Material/Legislação Pertinente aos Direitos Humanos/Direitos humanos e segurança pública.html' },
                { nome: 'Controle social e cidadania', link: 'https://88mvcodeup9.github.io/CONCURSO/PM-AL/ABAS/Quest%C3%B5es/Material/Legislação Pertinente aos Direitos Humanos/Controle social e cidadania.html' },
                { nome: 'Mecanismos de proteção e defesa dos direitos humanos', link: 'https://88mvcodeup9.github.io/CONCURSO/PM-AL/ABAS/Quest%C3%B5es/Material/Legislação Pertinente aos Direitos Humanos/Mecanismos de proteção e defesa dos direitos humanos.html' },

            banca: 'IDECAN',
            questoes: '~5 questões',
        }];

        // ------------------------------------------------------------
        // Geração dos cards (ingressos)
        // ------------------------------------------------------------
        const cardsGrid = document.getElementById('cardsGrid');

        materias.forEach((materia) => {
            const ticketHTML = `
                <div class="ticket-canvas" data-id="${materia.id}">
                    <div class="ticket-wrapper" onclick="abrirMateria(${materia.id})" title="Clique para acessar ${materia.nomeLinha}">
                        <div class="ticket">
                            <div class="t-main">
                                <div class="t-content">
                                    <div class="t-header">
                                        <div class="t-logo">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <path d="M4 19.5A2.5 2.5 0 016.5 17H20" stroke-linecap="round"/>
                                                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z" stroke-linecap="round"/>
                                            </svg>
                                            PM-AL
                                        </div>
                                        <div class="t-type">${materia.tipo}</div>
                                    </div>
                                    <div class="t-title">${materia.nome.replace('\n', '<br>')}</div>
                                    <div class="t-subtitle">${materia.subtitulo}</div>
                                    <div class="t-details">
                                        <div class="t-detail-item">
                                            <span class="t-label">Concurso</span>
                                            <span class="t-value">PM-AL 2026</span>
                                        </div>
                                        <div class="t-detail-item">
                                            <span class="t-label">Data</span>
                                            <span class="t-value">${materia.data}</span>
                                        </div>
                                        <div class="t-detail-item">
                                            <span class="t-label">Estado</span>
                                            <span class="t-value">Alagoas</span>
                                        </div>
                                        <div class="t-detail-item">
                                            <span class="t-label">Banca</span>
                                            <span class="t-value">IDECAN</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="t-perforation">
                                    <div class="t-perf-line"></div>
                                </div>
                            </div>
                            <div class="t-stub">
                                <div class="t-barcode-container">
                                    <div class="t-barcode"></div>
                                    <div class="t-barcode-id">PMAL-2026-MOD-${String(materia.id).padStart(2, '0')}</div>
                                </div>
                                <div class="t-admit">
                                    <div class="t-admit-text">Módulo</div>
                                    <div class="t-admit-num">${String(materia.id).padStart(2, '0')}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            cardsGrid.insertAdjacentHTML('beforeend', ticketHTML);
        });

        // ------------------------------------------------------------
        // Funções do Modal
        // ------------------------------------------------------------
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalSubtitle = document.getElementById('modalSubtitle');
        const modalTopics = document.getElementById('modalTopics');
        const modalInfo = document.getElementById('modalInfo');
        const modalClose = document.getElementById('modalClose');

        function abrirMateria(id) {
            const materia = materias.find(m => m.id === id);
            if (!materia) return;

            // Se a matéria tiver um link direto (caso da Matemática), redireciona
            if (materia.link) {
                window.location.href = materia.link;
                return;
            }

            // Caso contrário, abre o modal normalmente
            modalTitle.textContent = materia.nomeLinha;
            modalSubtitle.textContent = `${materia.subtitulo} — Polícia Militar de Alagoas 2026`;

            modalTopics.innerHTML = materia.topicos.map(t => `
                <li>
                    <button>
                        <a href="${t.link}">${t.nome}</a>
                    </button>
                </li>
            `).join('');

            modalInfo.innerHTML = `
                <span class="info-pill">📋 ${materia.questoes}</span>
                <span class="info-pill">🏛️ ${materia.banca}</span>
                <span class="info-pill">📅 ${materia.data}</span>
                <span class="info-pill">📍 Alagoas</span>
            `;
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function fecharModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        modalClose.addEventListener('click', fecharModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) fecharModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                fecharModal();
            }
        });
    </script>
</body>
